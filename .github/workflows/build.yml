name: Build

on:
  push:
    branches:
      - main
  pull_request:
    types: [opened, synchronize, reopened]

jobs:
  build:
    name: Compile and build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Compile debug
        run: ./gradlew :app:compileDebugKotlin

      # lintDebug is disabled: AGP 8.7 + Kotlin 2.1's UAST analysis crashes
      # on this source set ("symbol pointer already disposed"), a lint bug
      # rather than a finding. See the comment in app/build.gradle.kts.

      - name: Assemble debug
        run: ./gradlew :app:assembleDebug

      - name: Decode release keystore
        env:
          MEWDEKO_KEYSTORE_B64: ${{ secrets.MEWDEKO_KEYSTORE }}
        if: env.MEWDEKO_KEYSTORE_B64 != ''
        run: |
          echo "$MEWDEKO_KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/mewdeko-release.jks"
          echo "MEWDEKO_KEYSTORE=$RUNNER_TEMP/mewdeko-release.jks" >> "$GITHUB_ENV"

      - name: Assemble release
        env:
          MEWDEKO_KEYSTORE_PASSWORD: ${{ secrets.MEWDEKO_KEYSTORE_PASSWORD }}
          MEWDEKO_KEY_ALIAS: ${{ secrets.MEWDEKO_KEY_ALIAS }}
          MEWDEKO_KEY_PASSWORD: ${{ secrets.MEWDEKO_KEY_PASSWORD }}
        run: ./gradlew :app:assembleRelease

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: mewdeko-mobile-debug
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 7

      - name: Upload release APK
        if: env.MEWDEKO_KEYSTORE != ''
        uses: actions/upload-artifact@v4
        with:
          name: mewdeko-mobile-release
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error
          retention-days: 7
